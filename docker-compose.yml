services:
  db:
    image: postgres:18
    volumes:
      - ./tmp/db:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: postgres
  web:
    depends_on:
      - db
    build: .
    command: bundle exec rails s -p ${PORT} -b '0.0.0.0'
    container_name: jobs_app
    volumes:
      - .:/jobs
    ports:
      - "${PORT}:${PORT}"